name: Torrent Manager – Windows build és kiadás

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Forráskód letöltése
        uses: actions/checkout@v4
      - name: Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
      - name: Inno Setup 6 telepítése
        shell: pwsh
        run: choco install innosetup --yes --no-progress
      - name: Windows-program és telepítő fordítása
        shell: pwsh
        run: .\build-windows.ps1
      - name: Fordított fájlok feltöltése (Actions Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: TorrentManager-v0.3-Windows
          path: |
            dist/TorrentManager-v0.3-Windows-portable.zip
            dist/installer/TorrentManager-Setup-v0.3.0.exe
            dist/SHA256SUMS.txt
          if-no-files-found: error
      - name: GitHub Release közzététele verziócímke esetén
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/TorrentManager-v0.3-Windows-portable.zip
            dist/installer/TorrentManager-Setup-v0.3.0.exe
            dist/SHA256SUMS.txt
